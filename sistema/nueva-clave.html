<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contraseña nueva · Firmas Policía de Salta</title>
<meta name="theme-color" content="#1b3266">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top"><div class="in gutter"><div class="brand">Firmas<small>Policía de Salta</small></div></div></header>
<main class="gutter">
  <div class="card acceso" id="caja"><p class="lead" style="margin:0">Cargando…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s), caja = $("#caja");
  const C = window.CONFIG || {};
  if (!C.SUPABASE_URL || !window.supabase) { caja.innerHTML = `<p class="lead">El sistema no está configurado todavía.</p>`; return; }

  // Se lee el enlace ANTES de crear el cliente (después lo borra de la barra de direcciones)
  const h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  const vieneDelCorreo = h.get("type") === "recovery";
  const errorEnlace = h.get("error_code") || h.get("error") || q.get("error_code");
  const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth: { flowType: "implicit" } });
  const msg = (el, t, tipo) => { el.className = "msg" + (tipo ? " " + tipo : ""); el.textContent = t || ""; };
  const traducir = e => {
    const m = String(e && (e.message || e) || "");
    if (/different from the old/i.test(m)) return "La contraseña nueva tiene que ser distinta de la anterior.";
    if (/at least \d+|Password should/i.test(m)) return "La contraseña tiene que tener al menos 8 caracteres.";
    if (/not authorized/i.test(m)) return "El correo de avisos todavía no está habilitado para esa dirección. Avisale al administrador.";
    if (/rate limit|too many|seconds/i.test(m)) return "Se pidieron demasiados enlaces seguidos. Esperá unos minutos y probá de nuevo.";
    if (/session|JWT|expired/i.test(m)) return "El enlace venció. Pedí uno nuevo.";
    if (/Failed to fetch|network/i.test(m)) return "No hay conexión. Revisá internet y probá de nuevo.";
    return m;
  };

  /* ---- 1. Contraseña nueva (se llega desde el enlace del correo) ---- */
  function formulario(email) {
    caja.innerHTML = `
      <div><h1>Elegí tu contraseña nueva</h1>
      <p class="lead">${email ? `Para <b>${email.replace(/[<>&"]/g, "")}</b>. ` : ""}Escribila dos veces. Tiene que tener al menos 8 caracteres.</p></div>
      <form id="f" novalidate style="display:flex;flex-direction:column;gap:12px">
        <label class="f">Contraseña nueva <input class="i" id="c1" type="password" minlength="8" required autocomplete="new-password" autofocus></label>
        <label class="f">Repetí la contraseña <input class="i" id="c2" type="password" minlength="8" required autocomplete="new-password"></label>
        <label class="row" style="gap:8px;font-size:14px;color:var(--muted)"><input type="checkbox" id="ver"> Mostrar contraseñas</label>
        <div class="row"><button class="btn pri" type="submit" id="b">Guardar contraseña</button></div>
        <div class="msg" id="m" role="status"></div>
      </form>`;
    $("#ver").onchange = e => { $("#c1").type = $("#c2").type = e.target.checked ? "text" : "password"; };
    $("#f").onsubmit = async e => {
      e.preventDefault(); const m = $("#m"), b = $("#b");
      if ($("#c1").value.length < 8) return msg(m, "La contraseña tiene que tener al menos 8 caracteres.", "err");
      if ($("#c1").value !== $("#c2").value) return msg(m, "Las dos contraseñas no coinciden.", "err");
      b.disabled = true; msg(m, "Guardando…");
      const { error } = await sb.auth.updateUser({ password: $("#c1").value });
      if (error) { b.disabled = false; return msg(m, traducir(error), "err"); }
      caja.innerHTML = `<div class="aviso ok"><b>Listo, tu contraseña se cambió.</b></div>
        <div class="row"><a class="btn pri" href="./">Entrar al sistema</a></div>`;
    };
  }

  /* ---- 2. Pedir el enlace (desde "Olvidé mi contraseña") ---- */
  function pedir(aviso) {
    caja.innerHTML = `
      ${aviso || ""}
      <div><h1>Olvidé mi contraseña</h1>
      <p class="lead">Escribí el correo con el que entrás al sistema. Te mandamos un enlace para elegir una contraseña nueva.</p></div>
      <form id="f" novalidate style="display:flex;flex-direction:column;gap:12px">
        <label class="f">Correo <input class="i" id="email" type="email" required autocomplete="email" autofocus></label>
        <div class="row"><button class="btn pri" type="submit" id="b">Enviarme el enlace</button><span class="sp"></span><a href="./">Volver a ingresar</a></div>
        <div class="msg" id="m" role="status"></div>
      </form>`;
    $("#f").onsubmit = async e => {
      e.preventDefault(); const m = $("#m"), b = $("#b"), email = $("#email").value.trim();
      if (!/^\S+@\S+\.\S+$/.test(email)) return msg(m, "Escribí un correo válido.", "err");
      b.disabled = true; msg(m, "Enviando…");
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: new URL("nueva-clave.html", location.href).href.split("?")[0] });
      b.disabled = false;
      if (error) return msg(m, traducir(error), "err");
      caja.innerHTML = `<div class="aviso ok"><b>Te mandamos el enlace a ${email.replace(/[<>&"]/g, "")}.</b></div>
        <p class="lead" style="margin:0">Abrí el correo y tocá el enlace: te va a traer directo a elegir la contraseña nueva. Si no lo ves en unos minutos, revisá Spam o Promociones. El enlace vence en una hora y sirve una sola vez.</p>
        <div class="row"><a href="./">Volver a ingresar</a></div>`;
    };
  }

  (async () => {
    if (errorEnlace) {
      history.replaceState(null, "", location.pathname);
      return pedir(`<div class="aviso warn"><b>Ese enlace ya venció o ya se usó.</b> Pedí uno nuevo abajo.</div>`);
    }
    const { data } = await sb.auth.getSession();          // espera a que lea el enlace
    if (vieneDelCorreo && data.session) return formulario(data.session.user.email);
    if (vieneDelCorreo) return pedir(`<div class="aviso warn"><b>No pudimos validar el enlace.</b> Pedí uno nuevo abajo.</div>`);
    pedir();
  })();
})();
</script>
</body>
</html>
